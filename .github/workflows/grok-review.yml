name: grok-review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Grok CLI
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Run Grok review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Add Grok CLI to PATH
          export PATH="$HOME/.local/bin:$PATH"

          # Gather PR context
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Reviewing PR #${PR_NUMBER} in ${REPO} @ ${HEAD_SHA}"

          # Run Grok with PR review prompt
          grok -p "Review PR #${PR_NUMBER} in ${REPO}. Run: gh pr diff ${PR_NUMBER} --repo ${REPO}. Look for bugs, security issues, and broken logic. Post your review as a PR comment using: gh pr review ${PR_NUMBER} --repo ${REPO} --comment --body 'your review here'" --always-approve
